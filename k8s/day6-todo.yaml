apiVersion: v1
kind: Namespace
metadata:
  name: todo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-config
  namespace: todo
data:
  DB_HOST: mysql
  DB_NAME: pb
---
apiVersion: v1
kind: Secret
metadata:
  name: todo-secret
  namespace: todo
type: Opaque
stringData:
  DB_USER: pb
  DB_PASS: <db_password>
  MYSQL_ROOT_PASSWORD: <mysql_root_password>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: todo
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: todo
spec:
  replicas: 1
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - {name: MYSQL_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: todo-secret, key: MYSQL_ROOT_PASSWORD}}}
        - {name: MYSQL_DATABASE, value: pb}
        - {name: MYSQL_USER, valueFrom: {secretKeyRef: {name: todo-secret, key: DB_USER}}}
        - {name: MYSQL_PASSWORD, valueFrom: {secretKeyRef: {name: todo-secret, key: DB_PASS}}}
        ports: [{containerPort: 3306}]
        volumeMounts:
        - {name: data, mountPath: /var/lib/mysql}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: mysql-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: todo
spec:
  selector: {app: mysql}
  ports: [{port: 3306, targetPort: 3306}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: todo
spec:
  replicas: 1
  selector:
    matchLabels: {app: app}
  template:
    metadata:
      labels: {app: app}
    spec:
      imagePullSecrets: [{name: harbor-pull}]
      containers:
      - name: app
        image: harbor.local/pb/app:v1
        env:
        - {name: DB_HOST, valueFrom: {configMapKeyRef: {name: todo-config, key: DB_HOST}}}
        - {name: DB_NAME, valueFrom: {configMapKeyRef: {name: todo-config, key: DB_NAME}}}
        - {name: DB_USER, valueFrom: {secretKeyRef: {name: todo-secret, key: DB_USER}}}
        - {name: DB_PASS, valueFrom: {secretKeyRef: {name: todo-secret, key: DB_PASS}}}
        ports: [{containerPort: 5000}]
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: todo
spec:
  selector: {app: app}
  ports: [{port: 5000, targetPort: 5000}]
